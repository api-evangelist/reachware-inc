name: Reachware Inc.
description: >-
  Reachware is an Integration Platform as a Service (iPaaS) that lets separate
  SaaS and business systems operate as one connected ecosystem, with 200+
  prebuilt connectors to systems like NetSuite, QuickBooks, Microsoft Dynamics
  365, Odoo, SAP, Oracle, Magento, Zid and Qoyod. Alongside the core platform it
  ships Reach Pay (a payment API for Saudi Arabia payment gateways), Reachware
  Fatoora (ZATCA e-invoicing), and extension modules for banking, HR, inventory,
  loyalty and property management. Reach Pay exposes a hosted-redirect REST API
  for requesting payments, retrieving payment details, refunds and card
  tokenization. Reachware reports 3,500+ active subscriptions, 300+ customers,
  100M+ transactions, and is CMMI Level 3 certified. It was surfaced as a
  portfolio company of 500 Global and profiled by the API Evangelist enrichment
  pipeline.
